# Uso pela linha de comando (o deploy usa backend.app.scripts.migrar_banco):
#   alembic -c alembic.ini current
#   alembic -c alembic.ini revision -m "descricao"
# O banco vem do DATABASE_URL (Settings). Revisoes precisam ser idempotentes.
[alembic]
script_location = backend/app/db/migrations
prepend_sys_path = .
