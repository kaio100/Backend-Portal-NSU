services:
  api:
    build: .
    env_file: .env.docker
    environment:
      API_WORKER_ENABLED: "false"
      EMBEDDED_SCHEDULER_ENABLED: "false"
    ports:
      - "8000:8000"
    volumes:
      - nfse_data:/app/data
      - nfse_storage:/app/storage

  worker:
    build: .
    env_file: .env.docker
    command: python -m backend.app.worker.worker --sleep 5
    volumes:
      - nfse_data:/app/data
      - nfse_storage:/app/storage

  scheduler:
    build: .
    env_file: .env.docker
    command: python -m backend.app.worker.scheduler
    volumes:
      - nfse_data:/app/data
      - nfse_storage:/app/storage

volumes:
  nfse_data:
  nfse_storage:
